name: Production storage compatibility

on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:

concurrency:
  group: production-storage-compatibility
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.target == 'production' ||
      github.event.client_payload.environment == 'production'
    name: Migrate and validate retained content
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      statuses: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      DATABASE_SSL: "true"
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "1"
      VERCEL_GIT_COMMIT_SHA: ${{ github.event.client_payload.git.sha || github.sha }}
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations and validate retained content
        run: pnpm release:migrate

      - name: Report the deployment check to Vercel
        if: always() && github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - mothmark: production storage compatibility"
